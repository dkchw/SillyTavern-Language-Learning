<div class="st-lang-learning-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b><i class="fa-solid fa-graduation-cap"></i> Language Learning Tutor</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <p class="notes">Adds a language learning assistant bar above the chatbox. Formulate expressions in your target language, get Multiple Choice (MCQ) reply options, and learn natural conversational dialogue.</p>

            <div class="st-lang-row" style="margin-bottom: 8px;">
                <label for="st_lang_target">Target Language (Language you are learning):</label>
                <select id="st_lang_target" class="text_pole">
                    <option value="Japanese">Japanese (日本語)</option>
                    <option value="Spanish">Spanish (Español)</option>
                    <option value="French">French (Français)</option>
                    <option value="German">German (Deutsch)</option>
                    <option value="Chinese (Mandarin)">Chinese Mandarin (中文)</option>
                    <option value="Korean">Korean (한국어)</option>
                    <option value="Russian">Russian (Русский)</option>
                    <option value="Italian">Italian (Italiano)</option>
                    <option value="Portuguese">Portuguese (Português)</option>
                    <option value="Vietnamese">Vietnamese (Tiếng Việt)</option>
                    <option value="Arabic">Arabic (العربية)</option>
                    <option value="English">English</option>
                </select>
            </div>

            <div class="st-lang-row" style="margin-bottom: 8px;">
                <label for="st_lang_native">Native Language (Your explanation language):</label>
                <select id="st_lang_native" class="text_pole">
                    <option value="English">English</option>
                    <option value="Vietnamese">Vietnamese (Tiếng Việt)</option>
                    <option value="Chinese">Chinese (中文)</option>
                    <option value="Spanish">Spanish (Español)</option>
                    <option value="Russian">Russian (Русский)</option>
                    <option value="French">French (Français)</option>
                    <option value="German">German (Deutsch)</option>
                    <option value="Japanese">Japanese (日本語)</option>
                </select>
            </div>

            <div class="st-lang-row" style="margin-bottom: 8px;">
                <label for="st_lang_formality">Conversational Formality:</label>
                <select id="st_lang_formality" class="text_pole">
                    <option value="Natural / Contextual">Natural / Contextual (match the character)</option>
                    <option value="Casual / Informal">Casual / Informal (friends, peer)</option>
                    <option value="Polite / Standard">Polite / Standard (-desu/-masu, usted)</option>
                    <option value="Formal / Business">Formal / Business (keigo, honorific)</option>
                    <option value="Cute / Playful">Cute / Playful</option>
                </select>
            </div>

            <div class="st-lang-row" style="margin-bottom: 8px;">
                <label for="st_lang_level">Proficiency Level:</label>
                <select id="st_lang_level" class="text_pole">
                    <option value="Beginner">Beginner (simple vocab, basic grammar)</option>
                    <option value="Intermediate">Intermediate (conversational fluency)</option>
                    <option value="Advanced">Advanced (idiomatic expressions, nuanced)</option>
                </select>
            </div>

            <div class="st-lang-row" style="margin-top: 10px;">
                <label class="checkbox_label">
                    <input id="st_lang_show_reading" type="checkbox" checked />
                    <span>Show phonetic reading / pronunciation (Romaji, Pinyin, IPA)</span>
                </label>
            </div>

            <div class="st-lang-row" style="margin-top: 4px;">
                <label class="checkbox_label">
                    <input id="st_lang_show_grammar" type="checkbox" checked />
                    <span>Show grammar notes and nuance tips</span>
                </label>
            </div>

            <div class="st-lang-row" style="margin-top: 4px;">
                <label class="checkbox_label">
                    <input id="st_lang_show_audio" type="checkbox" checked />
                    <span>Enable Text-to-Speech audio preview button</span>
                </label>
            </div>
        </div>
    </div>
</div>
